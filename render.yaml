services:
  - type: web
    name: news-portal
    runtime: python
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "gunicorn --workers 1 --threads 4 --timeout 90 app:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATABASE_PATH
        value: /var/data/news.sqlite3
      - key: NEWS_REFRESH_MINUTES
        value: "10"
      - key: SECRET_KEY
        generateValue: true
    disk:
      name: news-data
      mountPath: /var/data
      sizeGB: 1
