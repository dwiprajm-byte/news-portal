<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ article.title }} - 24 Early News</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
    <header class="bg-red-700 text-white p-4 shadow">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <a href="/" class="text-2xl font-black uppercase font-serif">24 EARLY NEWS</a>
            <a href="/" class="bg-white text-red-700 px-3 py-1 rounded text-xs font-bold">Home</a>
        </div>
    </header>
    <main class="max-w-4xl mx-auto px-4 py-8 bg-white my-6 shadow rounded-xl">
        <span class="bg-red-600 text-white text-xs font-bold uppercase px-3 py-1 rounded">{{ article.category }}</span>
        <h1 class="text-3xl font-black text-slate-900 mt-4 mb-3 leading-snug">{{ article.title }}</h1>
        <span class="text-xs text-gray-400 block mb-6 font-mono">Published: {{ article.published }}</span>
        <div class="mb-6 rounded-lg overflow-hidden shadow">
            <img src="{{ article.image }}" alt="{{ article.title }}" class="w-full max-h-[450px] object-cover">
        </div>
        <div class="text-base text-slate-700 leading-relaxed space-y-4">
            {{ article.summary | safe }}
        </div>
    </main>
</body>
</html>
