    // ৩. কার্ড রেন্ডার ফাংশন
    function renderRecipes(items) {
      const container = document.getElementById('recipeGrid');
      container.innerHTML = '';
      items.forEach(r => {
        const card = document.createElement('div');
        card.className = "bg-white rounded-xl border border-stone-200/90 overflow-hidden shadow-sm hover:shadow-md transition duration-300 flex flex-col justify-between group";
        card.innerHTML = `
          <div>
            <div class="relative overflow-hidden h-44 bg-stone-100">
              <img src="${r.img}" alt="${r.name}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
              <span class="absolute top-3 left-3 bg-[#0f172a]/90 text-white text-[9px] font-bold uppercase tracking-widest px-2.5 py-0.5 rounded">
                ${r.cat}
              </span>
            </div>
            <div class="p-4">
              <h3 class="editorial-title text-base font-bold text-stone-900 group-hover:text-amber-800 transition leading-snug line-clamp-2">
                ${r.name}
              </h3>
              <div class="flex items-center gap-3 text-stone-400 text-xs mt-3 font-medium">
                <span><i class="far fa-clock mr-1"></i>${r.time}</span>
                <span>•</span>
                <span><i class="fas fa-fire-alt mr-1 text-amber-500"></i>${r.cal}</span>
              </div>
            </div>
          </div>
          <div class="p-4 pt-0">
            <button onclick="alert('Recipe details for: ${r.name}\\n\\nPreparation time: ${r.time}\\nCalories: ${r.cal}')" class="w-full py-2 bg-stone-50 hover:bg-[#0f172a] hover:text-white text-stone-800 text-xs font-bold rounded-lg border border-stone-200 transition">
              View Recipe
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // ৪. ক্যাটাগরি ফিল্টার ইঞ্জিন
    function filterRecipes(category) {
      document.querySelectorAll('.recipe-btn').forEach(btn => {
        btn.className = "recipe-btn px-4 py-2 text-xs font-bold uppercase tracking-wider rounded-lg transition bg-white text-stone-700 border border-stone-200 hover:bg-stone-50";
      });
      const activeBtn = document.getElementById('btn-' + category);
      if (activeBtn) {
        activeBtn.className = "recipe-btn px-4 py-2 text-xs font-bold uppercase tracking-wider rounded-lg transition bg-[#0f172a] text-white";
      }

      if (category === 'all') {
        renderRecipes(rawRecipes);
      } else {
        const filtered = rawRecipes.filter(r => r.cat.toLowerCase() === category.toLowerCase());
        renderRecipes(filtered);
      }
    }

    // প্রাথমিক লোড (সব ৫০টি রেসিপি)
    document.addEventListener('DOMContentLoaded', () => {
      renderRecipes(rawRecipes);
    });
