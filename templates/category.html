<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ category_name }} News - 24 Early News</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen flex flex-col">
  <header class="bg-white border-b shadow-sm sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <a href="/" class="text-2xl font-black text-red-700">24 EARLY<span class="text-gray-900 ml-1">NEWS</span></a>
      <a href="/" class="text-sm font-bold text-gray-600 hover:text-red-700">&larr; Back to Home</a>
    </div>
    <div class="bg-stone-100 border-t border-stone-200 px-4 py-1.5 text-xs"><div class="max-w-5xl mx-auto"><a href="/" class="font-bold text-stone-800 hover:text-amber-700 flex items-center gap-1"><i class="fas fa-home text-amber-600"></i> Home</a></div></div>
</header>

  <main class="max-w-7xl mx-auto px-4 py-8 flex-grow">
    <div class="border-b-2 border-red-700 pb-3 mb-6 flex justify-between items-center">
      <h1 class="text-2xl font-bold text-gray-900 flex items-center">
        <i class="fas fa-layer-group text-red-600 mr-2"></i> {{ category_name }} Top Headlines
      </h1>
      <span class="text-xs text-gray-500 font-semibold">Live 24/7 Updates</span>
    </div>

    <!-- Ad Unit -->
    <div class="border border-dashed border-gray-300 bg-white rounded-lg h-24 mb-6 flex items-center justify-center text-gray-400 font-bold text-xs uppercase tracking-widest shadow-sm">
      High CPC In-Category Header Ad (728x90)
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      {% for item in news_list %}
      <div class="bg-white rounded-xl shadow-sm border overflow-hidden flex flex-col justify-between hover:shadow-lg transition">
        <img src="{{ item.image }}" alt="{{ item.title }}" class="w-full h-48 object-cover">
        <div class="p-4 flex-grow flex flex-col justify-between">
          <div>
            <span class="text-xs font-bold text-red-600 uppercase">{{ item.category }}</span>
            <h3 class="text-base font-bold text-gray-900 mt-1 hover:text-red-700 leading-snug">
              <a href="/news/{{ item.id }}">{{ item.title }}</a>
            </h3>
          </div>
          <div class="text-xs text-gray-400 mt-4 border-t pt-2 flex justify-between items-center">
            <span>{{ item.date }}</span>
            <a href="/news/{{ item.id }}" class="text-red-600 font-bold hover:underline">Read Story &rarr;</a>
          </div>
        </div>
      </div>
      {% endfor %}
    </div>
  </main>
</body>
</html>
