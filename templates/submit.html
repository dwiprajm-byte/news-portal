<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Editorial Desk - 24 Early News</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-2xl mx-auto bg-white p-6 rounded-xl shadow">
        <h2 class="text-xl font-bold mb-4">Publish AI-Generated Dispatch</h2>
        <form action="/submit-news" method="POST" class="space-y-4">
            <input type="text" name="title" placeholder="Headline" required class="w-full border p-2 rounded text-sm">
            <select name="category" class="w-full border p-2 rounded text-sm">
                <option value="India">India</option>
                <option value="World">World</option>
                <option value="Business">Business</option>
                <option value="Technology">Technology</option>
            </select>
            <input type="url" name="image_url" placeholder="Image URL" class="w-full border p-2 rounded text-sm">
            <textarea name="content" rows="6" placeholder="Content" required class="w-full border p-2 rounded text-sm"></textarea>
            <button type="submit" class="bg-red-600 text-white font-bold py-2 w-full rounded">Publish</button>
        </form>
    </div>
</body>
</html>
