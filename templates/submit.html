<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newsroom Editorial Desk - 24 Early News</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased">

    <!-- Header -->
    <header class="bg-slate-950 text-white shadow-md sticky top-0 z-50 border-b-2 border-red-600">
        <div class="max-w-5xl mx-auto px-4 py-3.5 flex items-center justify-between">
            <a href="/" class="flex items-center gap-2 text-xl font-black text-white">
                <span class="bg-red-600 text-white px-2 py-0.5 rounded text-sm uppercase">24</span> Early News Desk
            </a>
            
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-1.5 bg-slate-900 px-2.5 py-1 rounded border border-slate-700 text-white text-xs font-mono">
                    <i class="fas fa-globe text-red-500"></i>
                    <select id="submitLangChoice" onchange="switchSubmitLang(this.value)" class="bg-transparent text-xs font-semibold focus:outline-none cursor-pointer text-slate-200">
                        <option value="en" class="bg-slate-900 text-white">English</option>
                        <option value="bn" class="bg-slate-900 text-white">বাংলা</option>
                        <option value="hi" class="bg-slate-900 text-white">हिन्दी</option>
                    </select>
                </div>
                <a href="/" class="text-xs font-bold text-slate-300 hover:text-white transition flex items-center gap-1">
                    <i class="fas fa-home"></i> <span id="lbl-home">Home</span>
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8">
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-10">
            
            <div class="border-b border-slate-200 pb-4 mb-6 flex items-center justify-between">
                <div>
                    <h1 class="text-2xl font-black text-slate-900 flex items-center gap-2" id="page-title">
                        <i class="fas fa-pen-nib text-red-600"></i> Editorial Dispatch Desk
                    </h1>
                    <p class="text-xs text-slate-500 mt-1" id="page-sub">Publish verified real-time journalism</p>
                </div>
                <span class="bg-green-100 text-green-800 text-[11px] font-bold px-3 py-1 rounded-full border border-green-200">
                    <i class="fas fa-shield-alt text-green-600 mr-1"></i> Two-Step Auth
                </span>
            </div>

            <!-- Form -->
            <form action="/submit-news" method="POST" class="space-y-6" onsubmit="return finalSubmitCheck()">

                <!-- 1. Reporter Identification & Verification Step -->
                <div class="bg-slate-50 p-5 rounded-xl border border-slate-300 space-y-4">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5" id="lbl-author">
                            Reporter / Full Author Name *
                        </label>
                        <input type="text" name="author" id="authorInput" required placeholder="Type full name (DWIPRAJ MALLICK for Founder)"
                            class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-red-600 text-sm bg-white font-semibold text-slate-900">
                    </div>

                    <!-- Founder Passcode & VERIFY BUTTON Box -->
                    <div id="founderSecurityBox" class="hidden p-4 bg-amber-50 border border-amber-300 rounded-xl space-y-2">
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-bold text-amber-900 flex items-center gap-1.5">
                                <i class="fas fa-key text-amber-600"></i> Founder Passcode Verification
                            </span>
                            <span id="verifiedBadge" class="hidden text-xs bg-green-600 text-white font-bold px-2.5 py-0.5 rounded-full flex items-center gap-1 shadow-xs">
                                <i class="fas fa-check-circle"></i> Verified Founder
                            </span>
                        </div>
                        <label class="block text-[11px] font-semibold text-slate-700">
                            সিকিউরিটি কোড বসিয়ে 'Verify' বাটনে ক্লিক করুন *
                        </label>
                        <div class="flex items-center gap-2">
                            <input type="password" name="founder_pin" id="founderPinInput" maxlength="4" placeholder="Enter 4-digit ID"
                                class="w-36 px-3 py-2 rounded-lg border border-amber-300 focus:ring-2 focus:ring-red-600 text-sm bg-white font-mono tracking-widest font-bold">
                            <button type="button" onclick="verifyFounderPasscode()" class="px-4 py-2 bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs rounded-lg transition shadow flex items-center gap-1.5">
                                <i class="fas fa-unlock-alt"></i> Verify
                            </button>
                        </div>
                    </div>

                    <!-- External Contributor Verification Box -->
                    <div id="contributorBox" class="pt-3 border-t border-slate-200">
                        <div class="flex items-center justify-between mb-3">
                            <span class="text-xs font-bold uppercase tracking-wider text-slate-700" id="lbl-ver-title">
                                <i class="fas fa-id-card text-slate-500 mr-1"></i> Contributor KYC Verification
                            </span>
                        </div>

                        <div id="docInputsGrid" class="space-y-4">
                            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                <div>
                                    <label class="block text-[11px] font-bold text-slate-600 mb-1" id="lbl-id-type">KYC ID Document *</label>
                                    <select name="id_type" id="idTypeSelect" onchange="handleKycPlaceholder()" class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-red-600 text-xs bg-white font-medium">
                                        <option value="PAN">PAN Card</option>
                                        <option value="VOTER">Voter ID Card</option>
                                        <option value="PASSPORT">Passport</option>
                                        <option value="DL">Driving Licence</option>
                                        <option value="GOV">Govt / Press ID</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-[11px] font-bold text-slate-600 mb-1" id="lbl-idproof">Document / ID Number *</label>
                                    <input type="text" name="id_proof" id="idProofField" placeholder="ABCDE1234F"
                                        class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-red-600 text-xs bg-white font-mono uppercase">
                                </div>
                                <div>
                                    <label class="block text-[11px] font-bold text-slate-600 mb-1" id="lbl-contact">Contact Phone / Email *</label>
                                    <input type="text" name="contact_info" id="contactField" placeholder="Phone or email"
                                        class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-red-600 text-xs bg-white">
                                </div>
                            </div>
                        </div>
                    </div>

                    <p id="auth-error-alert" class="text-xs text-red-600 font-bold hidden bg-red-50 p-2.5 rounded border border-red-200"></p>
                </div>

                <!-- 2. NEWS EDITORIAL DESK CONTENT (ভেরিফাই হলে আনলক হবে) -->
                <div id="newsContentWrapper" class="space-y-6 opacity-40 pointer-events-none transition duration-300">
                    
                    <!-- Headline -->
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5" id="lbl-headline">
                            Headline *
                        </label>
                        <input type="text" name="title" required id="input-headline" placeholder="Enter news headline..."
                            class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-red-600 focus:outline-none text-slate-900 font-bold text-base">
                    </div>

                    <!-- Category & Location -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5" id="lbl-category">
                                Category *
                            </label>
                            <select name="category" required class="w-full px-3 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-red-600 text-slate-900 text-sm font-medium">
                                <option value="India">India</option>
                                <option value="World">World</option>
                                <option value="Business">Business</option>
                                <option value="Technology">Technology</option>
                                <option value="Sports">Sports</option>
                                <option value="Entertainment">Entertainment</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5" id="lbl-location">
                                Location *
                            </label>
                            <input type="text" name="location" required id="input-location" placeholder="Ex: Kolkata, New Delhi"
                                class="w-full px-3 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-red-600 text-slate-900 text-sm">
                        </div>
                    </div>

                    <!-- Featured Image URL -->
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5" id="lbl-img">
                            Featured Image URL
                        </label>
                        <input type="url" name="image_url" id="input-img" placeholder="https://example.com/image.jpg (Optional - Category image used automatically)"
                            class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-red-600 text-slate-900 text-sm">
                    </div>

                    <!-- Content Body -->
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5" id="lbl-body">
                            In-Depth News Content *
                        </label>
                        <textarea name="content" rows="8" required id="input-body" placeholder="Write the detailed news report here..."
                            class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-red-600 focus:outline-none text-slate-900 text-base leading-relaxed"></textarea>
                    </div>

                    <!-- Submit Button -->
                    <div class="pt-4 border-t border-slate-200 flex flex-col sm:flex-row items-center justify-between gap-4">
                        <span class="text-xs text-green-700 font-semibold" id="txt-schema-notice">
                            <i class="fas fa-check-circle mr-1"></i> Automatic Google NewsArticle Schema Enabled
                        </span>
                        <button type="submit" class="w-full sm:w-auto px-8 py-3 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl shadow-lg transition transform active:scale-95 flex items-center justify-center gap-2">
                            <i class="fas fa-paper-plane"></i> <span id="btn-publish">Publish Dispatch</span>
                        </button>
                    </div>

                </div>

            </form>
        </div>
    </main>

    <footer class="bg-slate-950 text-slate-400 py-6 text-center text-xs border-t border-slate-800 mt-12">
        <p>&copy; 2026 24 Early News Network. All rights reserved.</p>
    </footer>

    <script>
        let isFounderVerified = false;

        const authorInput = document.getElementById('authorInput');
        const founderBox = document.getElementById('founderSecurityBox');
        const founderPin = document.getElementById('founderPinInput');
        const verifiedBadge = document.getElementById('verifiedBadge');
        const contributorBox = document.getElementById('contributorBox');
        const newsWrapper = document.getElementById('newsContentWrapper');
        const alertBox = document.getElementById('auth-error-alert');

        const idField = document.getElementById('idProofField');
        const contactField = document.getElementById('contactField');

        function checkAuthorSecurity() {
            const val = authorInput.value.trim().toUpperCase();
            if (val === 'DWIPRAJ MALLICK') {
                founderBox.classList.remove('hidden');
                contributorBox.classList.add('opacity-30', 'pointer-events-none');
                idField.required = false;
                contactField.required = false;
                alertBox.classList.add('hidden');
                
                if (!isFounderVerified) {
                    newsWrapper.classList.add('opacity-40', 'pointer-events-none');
                }
            } else {
                founderBox.classList.add('hidden');
                contributorBox.classList.remove('opacity-30', 'pointer-events-none');
                idField.required = true;
                contactField.required = true;
                isFounderVerified = false;
                verifiedBadge.classList.add('hidden');
                // বহিরাগতদের সাধারণ ইনপুটের জন্য আনলক রাখা
                newsWrapper.classList.remove('opacity-40', 'pointer-events-none');
            }
        }

        function verifyFounderPasscode() {
            const pin = founderPin.value.trim();
            const correctPin = "62" + "03";
            if (pin === correctPin) {
                isFounderVerified = true;
                verifiedBadge.classList.remove('hidden');
                alertBox.classList.add('hidden');
                newsWrapper.classList.remove('opacity-40', 'pointer-events-none');
                founderPin.classList.remove('border-red-500');
                founderPin.classList.add('border-green-500');
            } else {
                isFounderVerified = false;
                verifiedBadge.classList.add('hidden');
                alertBox.innerText = 'ভুল সিকিউরিটি কোড! ভেরিফাই করতে আপনার সঠিক ৪ সংখ্যার সিকিউরিটি কোড দিন।';
                alertBox.classList.remove('hidden');
                newsWrapper.classList.add('opacity-40', 'pointer-events-none');
                founderPin.focus();
            }
        }

        function finalSubmitCheck() {
            const val = authorInput.value.trim().toUpperCase();
            if (val === 'DWIPRAJ MALLICK') {
                if (!isFounderVerified) {
                    alertBox.innerText = 'দয়া করে সিকিউরিটি কোড প্রদান করে "Verify" বোতামে ক্লিক করুন!';
                    alertBox.classList.remove('hidden');
                    founderPin.focus();
                    return false;
                }
                return true;
            }

            if (val.includes('DWIPRAJ') || val === 'ADMIN') {
                alertBox.innerText = 'অননুমোদিত: প্রতিষ্ঠাতা বা প্রধান সম্পাদকের নাম নকল করা নিষিদ্ধ!';
                alertBox.classList.remove('hidden');
                return false;
            }

            return true;
        }

        authorInput.addEventListener('input', checkAuthorSecurity);

        // Language pack
        const SUBMIT_I18N = {
            en: {
                home: "Home", pageTitle: "Editorial Dispatch Desk", pageSub: "Publish verified real-time journalism",
                headline: "Headline *", category: "Category *", location: "Location *", author: "Reporter / Full Author Name *",
                verTitle: "Contributor KYC Verification", idType: "KYC ID Document *", idProof: "Document / ID Number *",
                contact: "Contact Phone / Email *", img: "Featured Image URL", body: "In-Depth News Content *",
                schemaNotice: "Automatic Google NewsArticle Schema Enabled", publish: "Publish Dispatch"
            },
            bn: {
                home: "হোম", pageTitle: "সংবাদ প্রকাশনা ডেস্ক", pageSub: "যাচাইকৃত বস্তুনিষ্ঠ সংবাদ প্রকাশ করুন",
                headline: "খবরের শিরোনাম *", category: "বিভাগ *", location: "ঘটনাস্থল *", author: "প্রতিবেদকের পুরো নাম *",
                verTitle: "কন্ট্রিবিউটর সরকারি KYC যাচাইকরণ", idType: "KYC ডকুমেন্ট নির্বাচন করুন *", idProof: "আইডি নম্বর *",
                contact: "যোগাযোগ নম্বর / ইমেল *", img: "খবরের ছবির লিঙ্ক (Image URL)", body: "সংবাদের মূল বিবরণ *",
                schemaNotice: "স্বয়ংক্রিয় গুগল এসইও ও NewsArticle Schema যুক্ত হবে", publish: "প্রকাশ করুন"
            },
            hi: {
                home: "होम", pageTitle: "संपादकीय समाचार डेस्क", pageSub: "तथ्यपूर्ण एवं प्रामाणिक समाचार प्रकाशित करें",
                headline: "समाचार शीर्षक *", category: "श्रेणी / वर्ग *", location: "स्थान *", author: "संवाददाता का पूरा नाम *",
                verTitle: "संवाददाता सरकारी KYC सत्यापन", idType: "KYC दस्तावेज़ चुनें *", idProof: "पहचान संख्या *",
                contact: "संपर्क फोन / ईमेल *", img: "समाचार चित्र लिंक (URL)", body: "विस्तृत समाचार विवरण *",
                schemaNotice: "स्वचालित गूगल एसईओ एवं NewsArticle Schema सक्रिय", publish: "प्रकाशित करें"
            }
        };

        function switchSubmitLang(lang) {
            localStorage.setItem('user_site_lang', lang);
            const d = SUBMIT_I18N[lang] || SUBMIT_I18N.en;

            document.getElementById('lbl-home').innerText = d.home;
            document.getElementById('page-title').innerHTML = '<i class="fas fa-pen-nib text-red-600 mr-2"></i> ' + d.pageTitle;
            document.getElementById('page-sub').innerText = d.pageSub;
            document.getElementById('lbl-headline').innerText = d.headline;
            document.getElementById('lbl-category').innerText = d.category;
            document.getElementById('lbl-location').innerText = d.location;
            document.getElementById('lbl-author').innerText = d.author;
            document.getElementById('lbl-ver-title').innerHTML = '<i class="fas fa-id-card text-slate-500 mr-1"></i> ' + d.verTitle;
            document.getElementById('lbl-id-type').innerText = d.idType;
            document.getElementById('lbl-idproof').innerText = d.idProof;
            document.getElementById('lbl-contact').innerText = d.contact;
            document.getElementById('lbl-img').innerText = d.img;
            document.getElementById('lbl-body').innerText = d.body;
            document.getElementById('txt-schema-notice').innerHTML = '<i class="fas fa-check-circle mr-1"></i> ' + d.schemaNotice;
            document.getElementById('btn-publish').innerText = d.publish;
            document.getElementById('submitLangChoice').value = lang;
        }

        document.addEventListener('DOMContentLoaded', function() {
            const currentSiteLang = localStorage.getItem('user_site_lang') || 'en';
            switchSubmitLang(currentSiteLang);
            checkAuthorSecurity();
        });
    </script>
</body>
</html>
